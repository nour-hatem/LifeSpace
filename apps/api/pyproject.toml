[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifespace-api"
version = "0.0.0"
description = "LifeSpace local single-user API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.133.1",
  "starlette>=1.3.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.50",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.0",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff",
  "mypy",
  "import-linter",
  "hypothesis==6.170.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lifespace"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.importlinter]
root_package = "lifespace"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api must not import infrastructure or sqlalchemy"
type = "forbidden"
source_modules = ["lifespace.api"]
forbidden_modules = ["lifespace.infrastructure", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "infrastructure must not import api"
type = "forbidden"
source_modules = ["lifespace.infrastructure"]
forbidden_modules = ["lifespace.api"]

[[tool.importlinter.contracts]]
name = "domain must stay pure"
type = "forbidden"
source_modules = ["lifespace.domain"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic_settings",
  "httpx",
  "uvicorn",
  "lifespace.api",
  "lifespace.infrastructure",
  "lifespace.config",
]

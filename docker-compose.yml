name: lifespace

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifespace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifespace_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-lifespace}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-lifespace} -d $${POSTGRES_DB:-lifespace}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
